<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KDAOC 서버 현황</title>
  <link rel="stylesheet" href="/dashboard/dashboard.css">
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">KDAOC LIVE</p>
        <h1>서버 현황</h1>
      </div>
      <div class="refresh">갱신 <span id="updatedAt">-</span></div>
    </header>

    <section class="summary" aria-label="서버 요약">
      <article><span>접속자</span><strong id="onlinePlayers">0</strong></article>
      <article><span>알비온</span><strong id="albionPlayers">0</strong></article>
      <article><span>미드가드</span><strong id="midgardPlayers">0</strong></article>
      <article><span>하이버니아</span><strong id="hiberniaPlayers">0</strong></article>
      <article><span>가동 시간</span><strong id="uptime">-</strong></article>
    </section>

    <section class="grid" aria-label="서버 통계 차트">
      <article class="panel wide"><h2>24시간 접속자 추이</h2><canvas id="populationChart"></canvas></article>
      <article class="panel"><h2>렐름 비율</h2><canvas id="realmChart"></canvas></article>
      <article class="panel"><h2>직업 분포</h2><canvas id="classChart"></canvas></article>
      <article class="panel wide"><h2>이번 주 서버 지급 골드</h2><canvas id="goldChart"></canvas></article>
      <article class="panel wide"><h2>이번 주 서버 지급 RP</h2><canvas id="rpChart"></canvas></article>
    </section>
  </main>
  <script src="/dashboard/dashboard.js"></script>
</body>
</html>
